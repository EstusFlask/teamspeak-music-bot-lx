# TSMusicBot LX — Docker Compose
# 在仓库根目录运行：
#   docker compose -f scripts/docker/docker-compose.yml up -d --build
#
# 本 fork 尚未发布独立的 GHCR 镜像，因此默认从当前源码构建。
# 镜像内置 Node.js、FFmpeg 和 Opus 编码器，宿主机无需安装 Node.js。

services:
  tsmusicbot:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile
    image: tsmusicbot-lx:local
    container_name: tsmusicbot
    # Use host network so the bot can reach TS3 server on LAN
    # If your TS3 server is on the same machine, this is required
    network_mode: host
    # If you prefer port mapping instead of host network, comment out
    # network_mode and uncomment ports:
    # ports:
    #   - "3000:3000"     # WebUI
    #   - "9987:9987/udp" # TS3 voice (only if TS3 server is in another container)
    volumes:
      - tsmusicbot-data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  tsmusicbot-data:
    driver: local
